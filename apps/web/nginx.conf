server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Serve PWA — all routes fall back to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (Vite hashes filenames)
    location ~* \.(js|css|png|ico|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the HTML shell (so new deployments load immediately)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
