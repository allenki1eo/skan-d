version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: skand
      POSTGRES_USER: skand
      POSTGRES_PASSWORD: skand_dev_pw
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U skand']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - '9000:9000'
      - '9001:9001'

  # MinIO bucket initialisation (one-shot)
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
        sleep 5 &&
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/skan-d
      "

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://skand:skand_dev_pw@postgres:5432/skand
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change_me_in_production_please
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: skan-d
      AWS_REGION: us-east-1
      WEB_ORIGIN: http://localhost:5173
      PORT: 3000
      NODE_ENV: development
    ports:
      - '3000:3000'

  worker-decode:
    build:
      context: ./apps/workers
      dockerfile: Dockerfile.decode
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://skand:skand_dev_pw@postgres:5432/skand
      REDIS_URL: redis://redis:6379
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: skan-d
      AWS_REGION: us-east-1
      DECODE_CONCURRENCY: '8'
    deploy:
      replicas: 2

  worker-playwright:
    build:
      context: ./apps/workers
      dockerfile: Dockerfile.playwright
    restart: unless-stopped
    shm_size: '1gb'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://skand:skand_dev_pw@postgres:5432/skand
      REDIS_URL: redis://redis:6379
      PW_CONCURRENCY: '20'
    deploy:
      replicas: 3

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - api
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - '80:80'

volumes:
  postgres_data:
  minio_data:
